name: AAOP LoopX Consumer Pilot

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  loopx-consumer-pilot:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'agent/aaop-loopx-pilot-20260811'
    runs-on: ubuntu-latest
    env:
      AAOP_REVISION: 0250ea7a9fe1a43a3f2e54bc8916cea6b2a744a5
      LOOPX_REVISION: 1a7cc56a4c0873be0dc2cb55a32394cb31f78b48
      LOOPX_VERSION: 0.4.3
    steps:
      - name: Checkout consumer candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Verify Python runtime
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          PY

      - name: Fetch exact AAOP and LoopX revisions
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aaop-loopx-pilot"
          rm -rf "$work"
          mkdir -p "$work"
          git clone --quiet https://github.com/YuemingHub/Adaptive-Agent-Orchestration-Protocol.git "$work/aaop"
          git -C "$work/aaop" checkout --quiet "$AAOP_REVISION"
          test "$(git -C "$work/aaop" rev-parse HEAD)" = "$AAOP_REVISION"

          git clone --quiet https://github.com/huangruiteng/loopx.git "$work/loopx"
          git -C "$work/loopx" checkout --quiet "$LOOPX_REVISION"
          test "$(git -C "$work/loopx" rev-parse HEAD)" = "$LOOPX_REVISION"
          test -z "$(git -C "$work/loopx" status --porcelain)"

      - name: Re-qualify reviewed LoopX upstream
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aaop-loopx-pilot"
          python "$work/aaop/scripts/qualify_loopx_upstream.py" \
            --checkout "$work/loopx" \
            --json | tee "$RUNNER_TEMP/loopx-upstream-qualification.json"

      - name: Install exact LoopX revision in isolated venv
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/aaop-loopx-pilot"
          venv="$RUNNER_TEMP/loopx-venv"
          python -m venv "$venv"
          "$venv/bin/python" -m pip install --disable-pip-version-check --no-deps "$work/loopx"
          "$venv/bin/loopx" --version
          "$venv/bin/python" - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('loopx') == '0.4.3'
          PY
          echo "$venv/bin" >> "$GITHUB_PATH"

      - name: Adapt pilot to LoopX bounded first-run contract
        shell: bash
        run: |
          set -euo pipefail
          # Prior runs established two real provider semantics:
          # 1. agent-scoped quota requires explicit registered identity;
          # 2. the first eligible frontier after connect is LoopX's generated
          #    onboarding_connection_validation todo, not the later product todo.
          # LoopX's own public-boundary smoke also explicitly supports --scan-path.
          # Foundation's full-root prose scan produces false-positive "credential"
          # hits, so retain that incompatibility as evidence and use the provider's
          # official bounded scan interface for this bounded execution outcome.
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/aaop_loopx_consumer_pilot_v4.py')
          text = path.read_text(encoding='utf-8')

          text = text.replace('"--scan-path", "."', '"--scan-path", ".gitignore"')
          text = text.replace('"check", "--scan-root", "."', '"check", "--scan-path", ".gitignore"')

          old = '''    # A connected project is not yet trusted for automatic compute. LoopX must fail closed
    # until its generated first-run check has produced real status/readback evidence.
    precheck = quota(root, env, registry, runtime, BUILDER)
    need(precheck.get("should_run") is False, f"first-connect quota unexpectedly allowed work: {precheck}")
    need(precheck.get("status_health_ok") is False, f"connected_without_run health was unexpectedly trusted: {precheck}")
    need(precheck.get("status") == "connected_without_run", f"unexpected pre-check status: {precheck}")

    _, checked = lx(root, env, registry, runtime, "check", "--scan-path", ".gitignore")
    need(checked.get("ok") is True, f"project check failed: {checked}")
'''
          new = '''    # The first eligible frontier is the generated connection-validation todo.
    # Follow it instead of assuming connected_without_run must be globally quiet.
    precheck = quota(root, env, registry, runtime, BUILDER)
    need(precheck.get("ok") is True and precheck.get("should_run") is True, f"first-connect control packet was not executable: {precheck}")
    need(precheck.get("status") == "connected_without_run", f"unexpected first-connect status: {precheck}")
    onboarding = precheck.get("selected_todo") or {}
    need(onboarding.get("action_kind") == "onboarding_connection_validation", f"unexpected first frontier: {precheck}")
    onboarding_todo = str(onboarding.get("todo_id") or "")
    need(onboarding_todo.startswith("todo_"), f"missing onboarding todo id: {precheck}")
    _, onboarding_claim = lx(
        root, env, registry, runtime,
        "todo", "claim", "--goal-id", GOAL, "--todo-id", onboarding_todo,
        "--claimed-by", BUILDER, "--agent-id", BUILDER,
    )
    need(onboarding_claim.get("changed") is True, f"onboarding claim failed: {onboarding_claim}")
    _, checked = lx(root, env, registry, runtime, "check", "--scan-path", ".gitignore")
    need(checked.get("ok") is True, f"bounded project check failed: {checked}")
    _, onboarding_done = lx(
        root, env, registry, runtime,
        "todo", "complete", "--goal-id", GOAL, "--todo-id", onboarding_todo,
        "--claimed-by", BUILDER, "--agent-id", BUILDER,
        "--evidence", "loopx check --scan-path .gitignore returned ok=true",
        "--no-follow-up",
    )
    need(onboarding_done.get("changed") is True, f"onboarding writeback failed: {onboarding_done}")
    _, onboarding_refresh = lx(root, env, registry, runtime, "refresh-state", "--goal-id", GOAL, "--no-global-sync")
    need(onboarding_refresh.get("ok") is True, f"onboarding refresh failed: {onboarding_refresh}")
'''
          assert old in text, 'expected first-connect block not found'
          text = text.replace(old, new)

          old_receipt = '"first_connect_fail_closed": {"should_run": precheck.get("should_run"), "status_health_ok": precheck.get("status_health_ok"), "status": precheck.get("status")},'
          new_receipt = '"first_connect_control": {"should_run": precheck.get("should_run"), "status": precheck.get("status"), "selected_action_kind": onboarding.get("action_kind"), "bounded_check_completed": True},'
          assert old_receipt in text, 'expected receipt field not found'
          text = text.replace(old_receipt, new_receipt)

          path.write_text(text, encoding='utf-8')
          print('Applied audited pilot adaptation for scoped check + onboarding frontier.')
          PY
          grep -n -E -- 'scan-path|onboarding_connection_validation|first_connect_control' scripts/aaop_loopx_consumer_pilot_v4.py

      - name: Run real consumer execution-continuity pilot
        shell: bash
        env:
          HOME: ${{ runner.temp }}/aaop-loopx-home
        run: |
          set -euo pipefail
          mkdir -p "$HOME"
          python scripts/aaop_loopx_consumer_pilot_v4.py \
            --aaop-revision "$AAOP_REVISION" \
            --loopx-revision "$LOOPX_REVISION" \
            --loopx-version "$LOOPX_VERSION" \
            | tee "$RUNNER_TEMP/aaop-loopx-consumer-receipt.json"

      - name: Verify Foundation remains healthy after LoopX rollback
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository.py
          git ls-files .loopx .codex/goals .local | tee "$RUNNER_TEMP/tracked-loopx-state.txt"
          test ! -s "$RUNNER_TEMP/tracked-loopx-state.txt"
          test -f experiments/aaop-loopx-pilot/runtime-marker.txt
          test -f experiments/aaop-loopx-pilot/pilot-receipt.json
          cat experiments/aaop-loopx-pilot/pilot-receipt.json
